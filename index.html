<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102028">
<meta name="color-scheme" content="dark">
<meta name="description" content="a venice beach mural.">
<title>cody larae</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="canonical" href="https://codylarae.art/">
<meta property="og:type" content="website">
<meta property="og:title" content="cody larae">
<meta property="og:description" content="a venice beach mural.">

<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:description" content="a venice beach mural.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6efe9;
    --ink-2: rgba(246, 239, 233, 0.72);
    --ink-3: rgba(246, 239, 233, 0.5);
    --orange: #ff4d1a;
    --gold: #ffd700;
    --gold-deep: #c9a227;
    --gold-bright: #ffe566;
    --teal: #1aadb3;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
    --star-hit: 48px;
    --star-svg: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #102028;
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    pointer-events: none;
  }
  .viewport {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: #102028;
  }
  @media (hover: hover) and (pointer: fine) {
    .viewport { cursor: grab; }
    .viewport.is-panning,
    .viewport.is-panning .star { cursor: grabbing; }
  }
  .stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 2800px;
    height: 1867px;
    transform-origin: 0 0;
    visibility: hidden;
  }
  .stage.is-ready { visibility: visible; }
  .mural {
    position: relative;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: fill;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .sky {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .star {
    position: absolute;
    z-index: 1;
    width: var(--star-hit);
    height: var(--star-hit);
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    appearance: none;
    -webkit-appearance: none;
    display: grid;
    place-items: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  .star svg {
    display: block;
    width: var(--star-svg);
    height: var(--star-svg);
    overflow: visible;
    animation: star-blink 1.05s ease-in-out infinite;
    animation-delay: var(--d, 0s);
    filter:
      drop-shadow(0 0 3px rgba(255, 215, 0, 0.45))
      drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
  }
  .star svg path { fill: var(--gold); }
  .star.is-read {
    z-index: 1;
  }
  .star.is-read svg {
    animation: none;
    filter:
      drop-shadow(0 0 3px rgba(26, 173, 179, 0.7))
      drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
  }
  .star.is-read svg path { fill: var(--teal); }
  .star.is-today {
    z-index: 2;
    width: calc(var(--star-hit) * 1.75);
    height: calc(var(--star-hit) * 1.75);
  }
  .star.is-today svg {
    width: calc(var(--star-svg) * 2.2);
    height: calc(var(--star-svg) * 2.2);
    animation: today-blink 1.05s ease-in-out infinite;
    animation-delay: 0s;
    filter:
      drop-shadow(0 0 6px rgba(255, 229, 102, 0.95))
      drop-shadow(0 0 16px rgba(255, 215, 0, 0.9))
      drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45));
  }
  .star.is-today svg path { fill: var(--gold-bright); }
  .star.is-read svg { animation: none; }
  @keyframes star-blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    46% { opacity: 1; transform: scale(1); }
    54%, 72% { opacity: 0.22; transform: scale(0.76); }
  }
  @keyframes today-blink {
    0%, 100% { opacity: 1; transform: scale(1.14); }
    46% { opacity: 1; transform: scale(1.14); }
    54%, 72% { opacity: 0.2; transform: scale(0.72); }
  }
  .star:hover svg,
  html.keyboard .star:focus-visible svg {
    opacity: 1;
    transform: scale(1.18);
    animation: none;
  }
  .star:hover svg path,
  html.keyboard .star:focus-visible svg path { fill: var(--gold-bright); }
  .star.is-read:hover svg path,
  html.keyboard .star.is-read:focus-visible svg path { fill: var(--teal); }
  .star:focus,
  .star:focus-visible {
    outline: none;
    box-shadow: none;
  }
  html.keyboard .star:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }
  .guide {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }
  .guide.is-gone { opacity: 0; transition: opacity 640ms ease; }
  .guide-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-bright);
    transform: translate(-50%, -50%);
    animation: trail 1.7s ease-in-out infinite;
    animation-delay: calc(var(--n) * 0.2s);
  }
  .guide-glow {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 215, 0, 0.34), rgba(255, 215, 0, 0) 68%);
    animation: trail-glow 1.7s ease-in-out infinite;
  }
  @keyframes trail {
    0%, 100% {
      opacity: 0.12;
      transform: translate(-50%, -50%) scale(0.65);
      box-shadow: 0 0 6px 1px rgba(201, 162, 39, 0.25);
    }
    50% {
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(1.45);
      box-shadow: 0 0 14px 4px rgba(255, 215, 0, 0.55);
    }
  }
  @keyframes trail-glow {
    0%, 100% { opacity: 0.28; }
    50% { opacity: 0.85; }
  }
  dialog {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    overflow: hidden;
  }
  dialog::backdrop {
    background: rgba(6, 10, 14, 0.78);
  }
  .sheet {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding:
      max(28px, env(safe-area-inset-top))
      22px
      max(28px, env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  .inner {
    width: fit-content;
    max-width: min(34rem, 100%);
    max-height: 100%;
    overflow: auto;
    text-align: left;
    -webkit-user-select: text;
    user-select: text;
    touch-action: pan-y;
  }
  .inner time {
    display: block;
    margin: 0 0 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-3);
  }
  .inner blockquote {
    margin: 0;
    quotes: none;
    font-family: var(--mono);
    font-size: clamp(16px, 2.3vw, 22px);
    font-weight: 500;
    line-height: 1.65;
    color: rgba(246, 239, 233, 0.92);
    text-align: left;
    text-transform: lowercase;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .inner blockquote::before,
  .inner blockquote::after { content: none; }
  .by {
    margin: 12px 0 0;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
    color: #FFD700;
    text-align: right;
    text-transform: lowercase;
  }
  ::selection { background: var(--orange); color: #1a0c06; }
  @media (prefers-reduced-motion: reduce) {
    .star svg,
    .star.is-today svg,
    .guide-dot,
    .guide-glow { animation: none; }
    .star.is-today svg { opacity: 1; transform: none; }
    .guide-dot {
      opacity: 0.8;
      box-shadow: 0 0 10px 2px rgba(255, 215, 0, 0.45);
    }
    .guide-glow { opacity: 0.7; }
  }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] .inner { animation: rise 180ms ease; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<h1 class="sr">cody larae</h1>
<div id="viewport" class="viewport">
  <div id="stage" class="stage">
    <img id="mural" class="mural" src="mural.jpg" width="2800" height="1867" alt="Venice Beach mural of a laughing boy in thick black glasses, painted on a dark utility box, with the word Never beside him." draggable="false" fetchpriority="high">
    <div id="sky" class="sky"></div>
  </div>
  <div id="guide" class="guide" hidden aria-hidden="true"></div>
</div>
<dialog id="quote" aria-labelledby="q-text">
  <div class="sheet">
    <article class="inner">
      <time id="q-date"></time>
      <blockquote id="q-text"></blockquote>
      <p class="by" id="q-by"></p>
    </article>
  </div>
</dialog>
<script>
(() => {
  const QUOTES = "https://jayroddi.dev/quote-of-the-day/quotes.json";
  const FACE_X = 0.46;
  const FACE_Y = 0.44;
  const OVERSCAN = 1.5;

  const viewport = document.getElementById("viewport");
  const stage = document.getElementById("stage");
  const mural = document.getElementById("mural");
  const sky = document.getElementById("sky");
  const dialog = document.getElementById("quote");
  const qDate = document.getElementById("q-date");
  const qText = document.getElementById("q-text");
  const qBy = document.getElementById("q-by");
  const inner = dialog.querySelector(".inner");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const quoteOf = new WeakMap();

  let imgW = 2800;
  let imgH = 1867;
  let scale = 1;
  let x = 0;
  let y = 0;
  let pinnedToFace = true;
  let lastVw = 0;
  let lastVh = 0;
  let signature = null;
  let current = [];
  let opener = null;
  let suppressClick = false;
  let suppressStarFocus = false;
  let todayBtn = null;
  let guideDone = false;
  const READ_KEY = "codylarae.read";
  let readKeys = new Set();
  let blockDismissUntil = 0;
  let keyboardNav = false;
  let glide = 0;
  let vx = 0;
  let vy = 0;
  let trackX = 0;
  let trackY = 0;
  let trackT = 0;
  let lastTouchAt = 0;
  let midnightTimer = 0;

  const touches = new Map();
  let mouse = null;
  let pinch = null;
  let gestureMoved = false;
  let tapStar = null;

  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFD700" d="M12 1.15 14.1 9.9 22.85 12 14.1 14.1 12 22.85 9.9 14.1 1.15 12 9.9 9.9Z"/></svg>';
  const guide = document.getElementById("guide");
  const guideGlow = document.createElement("div");
  guideGlow.className = "guide-glow";
  const guideDots = [0, 1, 2, 3].map((i) => {
    const dot = document.createElement("span");
    dot.className = "guide-dot";
    dot.style.setProperty("--n", String(i));
    return dot;
  });
  guide.append(guideGlow, ...guideDots);

  function loadRead() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      const list = raw ? JSON.parse(raw) : [];
      readKeys = new Set(Array.isArray(list) ? list.filter((k) => typeof k === "string") : []);
    } catch {
      readKeys = new Set();
    }
  }

  function saveRead() {
    try { localStorage.setItem(READ_KEY, JSON.stringify([...readKeys])); } catch {}
  }

  function setGlyphFill(btn) {
    const path = btn.querySelector("path");
    if (!path) return;
    path.setAttribute("fill", btn.classList.contains("is-read")
      ? "#1aadb3"
      : btn.classList.contains("is-today")
        ? "#ffe566"
        : "#FFD700");
  }

  function markRead(q, btn) {
    const key = quoteKey(q);
    if (!readKeys.has(key)) {
      readKeys.add(key);
      saveRead();
    }
    btn.classList.add("is-read");
    btn.classList.remove("is-today");
    setGlyphFill(btn);
    if (todayBtn === btn) todayBtn = null;
    dismissGuide();
  }

  function starPoint(btn) {
    return {
      x: x + (parseFloat(btn.style.left) / 100) * imgW * scale,
      y: y + (parseFloat(btn.style.top) / 100) * imgH * scale,
    };
  }

  function dismissGuide() {
    if (guideDone) return;
    guideDone = true;
    guide.classList.add("is-gone");
    setTimeout(() => { guide.hidden = true; }, 680);
  }

  function updateGuide() {
    if (guideDone || !todayBtn) return;
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    if (vw < 2 || vh < 2) return;
    const p = starPoint(todayBtn);
    const pad = 36;
    if (p.x >= pad && p.y >= pad && p.x <= vw - pad && p.y <= vh - pad) {
      dismissGuide();
      return;
    }
    const cx = vw / 2;
    const cy = vh / 2;
    const dx = p.x - cx;
    const dy = p.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    let tHit = Infinity;
    if (ux > 1e-4) tHit = Math.min(tHit, (vw - 20 - cx) / ux);
    else if (ux < -1e-4) tHit = Math.min(tHit, (20 - cx) / ux);
    if (uy > 1e-4) tHit = Math.min(tHit, (vh - 20 - cy) / uy);
    else if (uy < -1e-4) tHit = Math.min(tHit, (20 - cy) / uy);
    if (!Number.isFinite(tHit) || tHit < 8) tHit = Math.min(vw, vh) * 0.42;
    [0.52, 0.68, 0.82, 0.95].forEach((frac, i) => {
      const t = tHit * frac;
      guideDots[i].style.left = (cx + ux * t) + "px";
      guideDots[i].style.top = (cy + uy * t) + "px";
    });
    guideGlow.style.left = (cx + ux * tHit) + "px";
    guideGlow.style.top = (cy + uy * tHit) + "px";
    guide.hidden = false;
    guide.classList.remove("is-gone");
  }

  function releaseStarFocus() {
    suppressStarFocus = true;
    const blurStar = () => {
      const active = document.activeElement;
      const star = active && active.closest ? active.closest(".star") : null;
      if (star) star.blur();
    };
    blurStar();
    requestAnimationFrame(blurStar);
    setTimeout(blurStar, 30);
    setTimeout(() => {
      blurStar();
      suppressStarFocus = false;
    }, 180);
  }

  function readImageSize() {
    imgW = mural.naturalWidth || Number(mural.getAttribute("width")) || 2800;
    imgH = mural.naturalHeight || Number(mural.getAttribute("height")) || 1867;
    stage.style.width = imgW + "px";
    stage.style.height = imgH + "px";
  }

  function fitViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    viewport.style.width = vv.width + "px";
    viewport.style.height = vv.height + "px";
    viewport.style.top = vv.offsetTop + "px";
    viewport.style.left = vv.offsetLeft + "px";
  }

  function limits() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const contain = Math.min(vw / imgW, vh / imgH);
    const cover = Math.max(vw / imgW, vh / imgH);
    const min = contain;
    const max = Math.max(cover * 5, min * 4);
    const initial = Math.min(max, Math.max(min, cover * OVERSCAN));
    return { vw, vh, min, max, initial };
  }

  function clamp() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const sw = imgW * scale;
    const sh = imgH * scale;
    if (sw <= vw + 0.5) x = (vw - sw) / 2;
    else x = Math.min(0, Math.max(vw - sw, x));
    if (sh <= vh + 0.5) y = (vh - sh) / 2;
    else y = Math.min(0, Math.max(vh - sh, y));
  }

  function apply() {
    stage.style.transform = "translate3d(" + x + "px," + y + "px,0) scale(" + scale + ")";
    updateGuide();
  }

  function syncStarSize() {
    document.documentElement.style.setProperty("--star-hit", (48 / scale) + "px");
    document.documentElement.style.setProperty("--star-svg", (12 / scale) + "px");
  }

  function frameFace() {
    const box = limits();
    if (!box.vw || !box.vh) return;
    scale = box.initial;
    x = box.vw / 2 - FACE_X * imgW * scale;
    y = box.vh / 2 - FACE_Y * imgH * scale;
    clamp();
    syncStarSize();
    apply();
    lastVw = box.vw;
    lastVh = box.vh;
    stage.classList.add("is-ready");
  }

  function holdCenter(prevW, prevH) {
    const box = limits();
    const wx = (prevW / 2 - x) / scale;
    const wy = (prevH / 2 - y) / scale;
    scale = Math.min(box.max, Math.max(box.min, scale));
    x = box.vw / 2 - wx * scale;
    y = box.vh / 2 - wy * scale;
    clamp();
    apply();
    lastVw = box.vw;
    lastVh = box.vh;
  }

  function onResize() {
    const prevW = lastVw;
    const prevH = lastVh;
    fitViewport();
    if (viewport.clientWidth < 2 || viewport.clientHeight < 2) return;
    if (pinnedToFace || !prevW) frameFace();
    else holdCenter(prevW, prevH);
  }

  function zoomAt(clientX, clientY, next) {
    const rect = viewport.getBoundingClientRect();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    const box = limits();
    next = Math.min(box.max, Math.max(box.min, next));
    const wx = (cx - x) / scale;
    const wy = (cy - y) / scale;
    scale = next;
    x = cx - wx * scale;
    y = cy - wy * scale;
    clamp();
    apply();
  }

  function centerOnImage(ix, iy) {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    x = vw / 2 - ix * scale;
    y = vh / 2 - iy * scale;
    pinnedToFace = false;
    clamp();
    apply();
  }

  function stopGlide() {
    if (glide) cancelAnimationFrame(glide);
    glide = 0;
    vx = 0;
    vy = 0;
  }

  function trackVelocity(px, py) {
    const now = performance.now();
    const dt = now - trackT;
    if (dt > 0 && dt < 80) {
      vx = vx * 0.45 + ((px - trackX) / dt) * 0.55;
      vy = vy * 0.45 + ((py - trackY) / dt) * 0.55;
    } else if (dt >= 80) {
      vx = 0;
      vy = 0;
    }
    trackX = px;
    trackY = py;
    trackT = now;
  }

  function startGlide() {
    if (reduceMotion || Math.hypot(vx, vy) < 0.04) return;
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(34, now - last);
      last = now;
      if (dt <= 0) {
        glide = requestAnimationFrame(step);
        return;
      }
      const px = x;
      const py = y;
      x += vx * dt;
      y += vy * dt;
      const decay = Math.pow(0.92, dt / 16);
      vx *= decay;
      vy *= decay;
      clamp();
      if (Math.abs(x - px) > 0.2 && Math.sign(x - px) !== Math.sign(vx)) vx = 0;
      if (Math.abs(x - px) < 0.01) vx = 0;
      if (Math.abs(y - py) < 0.01) vy = 0;
      apply();
      if (Math.hypot(vx, vy) < 0.012) {
        glide = 0;
        return;
      }
      glide = requestAnimationFrame(step);
    };
    glide = requestAnimationFrame(step);
  }

  function armClickSuppression() {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 500);
  }

  function pinchPoints() {
    const pts = [...touches.values()];
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return {
      dist: Math.hypot(dx, dy) || 1,
      x: (pts[0].x + pts[1].x) / 2,
      y: (pts[0].y + pts[1].y) / 2,
    };
  }

  function beginPinch() {
    const m = pinchPoints();
    pinch = { dist: m.dist, x: m.x, y: m.y };
    gestureMoved = true;
    tapStar = null;
    pinnedToFace = false;
  }

  function movePinch() {
    const m = pinchPoints();
    const factor = m.dist / pinch.dist;
    x += m.x - pinch.x;
    y += m.y - pinch.y;
    pinch = { dist: m.dist, x: m.x, y: m.y };
    zoomAt(m.x, m.y, scale * factor);
  }

  function onTouchStart(e) {
    if (dialog.open) return;
    if (e.cancelable) e.preventDefault();
    keyboardNav = false;
    document.documentElement.classList.remove("keyboard");
    lastTouchAt = performance.now();
    stopGlide();
    for (const t of e.changedTouches) {
      touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    }
    if (touches.size === 1) {
      const t = e.changedTouches[0];
      const target = t.target;
      gestureMoved = false;
      tapStar = target && target.closest ? target.closest(".star") : null;
      pinch = null;
      vx = 0;
      vy = 0;
      trackX = t.clientX;
      trackY = t.clientY;
      trackT = performance.now();
      mouse = { x: t.clientX, y: t.clientY, ox: x, oy: y, touch: true };
    } else if (touches.size >= 2) {
      mouse = null;
      beginPinch();
    }
  }

  function onTouchMove(e) {
    if (!touches.size || dialog.open) return;
    if (e.cancelable) e.preventDefault();
    for (const t of e.changedTouches) {
      if (touches.has(t.identifier)) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    }
    if (touches.size >= 2) {
      if (!pinch) beginPinch();
      movePinch();
      viewport.classList.add("is-panning");
      return;
    }
    if (!mouse || !mouse.touch) return;
    const t = [...touches.values()][0];
    const dx = t.x - mouse.x;
    const dy = t.y - mouse.y;
    if (!gestureMoved && dx * dx + dy * dy > 64) {
      gestureMoved = true;
      tapStar = null;
      pinnedToFace = false;
      viewport.classList.add("is-panning");
    }
    if (!gestureMoved) return;
    x = mouse.ox + dx;
    y = mouse.oy + dy;
    trackVelocity(t.x, t.y);
    clamp();
    apply();
  }

  function onTouchEnd(e, cancelled) {
    for (const t of e.changedTouches) touches.delete(t.identifier);
    if (e.cancelable) e.preventDefault();
    if (touches.size >= 2) {
      beginPinch();
      return;
    }
    if (touches.size === 1) {
      const t = [...touches.values()][0];
      mouse = { x: t.x, y: t.y, ox: x, oy: y, touch: true };
      pinch = null;
      gestureMoved = true;
      tapStar = null;
      vx = 0;
      vy = 0;
      return;
    }
    const moved = gestureMoved;
    const star = tapStar;
    mouse = null;
    pinch = null;
    tapStar = null;
    gestureMoved = false;
    viewport.classList.remove("is-panning");
    armClickSuppression();
    if (!cancelled && !moved && star && !dialog.open) openFrom(star);
    else if (moved) startGlide();
  }

  viewport.addEventListener("touchstart", onTouchStart, { passive: false, capture: true });
  viewport.addEventListener("touchmove", onTouchMove, { passive: false, capture: true });
  viewport.addEventListener("touchend", (e) => onTouchEnd(e, false), { passive: false, capture: true });
  viewport.addEventListener("touchcancel", (e) => onTouchEnd(e, true), { passive: false, capture: true });
  document.addEventListener("touchmove", (e) => {
    if (dialog.open) return;
    if (e.cancelable) e.preventDefault();
  }, { passive: false, capture: true });
  ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
    viewport.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });

  viewport.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0 || dialog.open) return;
    if (performance.now() - lastTouchAt < 700) return;
    keyboardNav = false;
    document.documentElement.classList.remove("keyboard");
    stopGlide();
    const target = e.target;
    mouse = {
      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      ox: x,
      oy: y,
      touch: false,
      moved: false,
      star: target && target.closest ? target.closest(".star") : null,
    };
    vx = 0;
    vy = 0;
    trackX = e.clientX;
    trackY = e.clientY;
    trackT = performance.now();
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove", (e) => {
    if (!mouse || mouse.touch || e.pointerId !== mouse.id) return;
    const dx = e.clientX - mouse.x;
    const dy = e.clientY - mouse.y;
    if (!mouse.moved && dx * dx + dy * dy > 16) {
      mouse.moved = true;
      pinnedToFace = false;
      viewport.classList.add("is-panning");
    }
    if (!mouse.moved) return;
    e.preventDefault();
    x = mouse.ox + dx;
    y = mouse.oy + dy;
    trackVelocity(e.clientX, e.clientY);
    clamp();
    apply();
  });
  function endMouse(e) {
    if (!mouse || mouse.touch || e.pointerId !== mouse.id) return;
    const moved = mouse.moved;
    const star = mouse.star;
    mouse = null;
    viewport.classList.remove("is-panning");
    armClickSuppression();
    if (!moved && star) openFrom(star);
    else if (moved) startGlide();
  }
  viewport.addEventListener("pointerup", endMouse);
  viewport.addEventListener("pointercancel", endMouse);
  viewport.addEventListener("wheel", (e) => {
    if (dialog.open) return;
    e.preventDefault();
    stopGlide();
    pinnedToFace = false;
    let dx = e.deltaX;
    let dy = e.deltaY;
    if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
    else if (e.deltaMode === 2) {
      dx *= viewport.clientWidth;
      dy *= viewport.clientHeight;
    }
    if (e.ctrlKey) zoomAt(e.clientX, e.clientY, scale * Math.exp(-dy * 0.002));
    else {
      x -= dx;
      y -= dy;
      clamp();
      apply();
    }
  }, { passive: false });
  viewport.addEventListener("dragstart", (e) => e.preventDefault());

  viewport.addEventListener("click", (e) => {
    const btn = e.target.closest(".star");
    if (!btn) return;
    if (suppressClick) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    openFrom(btn);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      keyboardNav = true;
      document.documentElement.classList.add("keyboard");
    }
    if (dialog.open) return;
    let dx = 0;
    let dy = 0;
    const step = e.shiftKey ? 140 : 72;
    if (e.key === "ArrowLeft") dx = step;
    else if (e.key === "ArrowRight") dx = -step;
    else if (e.key === "ArrowUp") dy = step;
    else if (e.key === "ArrowDown") dy = -step;
    else return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    stopGlide();
    pinnedToFace = false;
    x += dx;
    y += dy;
    clamp();
    apply();
  });

  function chicagoToday() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date());
    const get = (type) => parts.find((p) => p.type === type).value;
    return get("year") + "-" + get("month") + "-" + get("day");
  }

  function spokenDate(iso) {
    const parts = iso.split("-").map(Number);
    return new Intl.DateTimeFormat("en-US", {
      month: "long",
      day: "numeric",
      year: "numeric",
      timeZone: "UTC",
    }).format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])));
  }

  function usable(rows) {
    const day = chicagoToday();
    return rows
      .filter((e) => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.date <= day)
      .map((e) => ({
        date: e.date,
        text: String(e.text || e.quote || "").trim(),
        author: String(e.author || "").trim().replace(/^\s*[-–—]\s*/, ""),
      }))
      .filter((e) => e.text && e.author)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }

  function quoteKey(q) {
    return q.date + "\0" + q.text;
  }

  function spotForIndex(i) {
    const g = 1.324717957244746;
    const u = (0.5 + (1 / g) * i) % 1;
    const v = (0.5 + (1 / (g * g)) * i) % 1;
    const edge = 0.04;
    return {
      l: (edge + u * (1 - edge * 2)) * 100,
      t: (edge + v * (1 - edge * 2)) * 100,
    };
  }

  function spotsFor(list) {
    const ordered = [...list].sort((a, b) => (quoteKey(a) < quoteKey(b) ? -1 : 1));
    const map = new Map();
    ordered.forEach((q, i) => map.set(quoteKey(q), spotForIndex(i)));
    return list.map((q) => map.get(quoteKey(q)));
  }

  let lastOpen = 0;
  function openQuote(q, btn) {
    const now = performance.now();
    if (dialog.open && now - lastOpen < 450) return;
    lastOpen = now;
    blockDismissUntil = now + 550;
    stopGlide();
    qDate.dateTime = q.date;
    qDate.textContent = q.date.replaceAll("-", ".");
    qText.textContent = q.text;
    qBy.textContent = q.author;
    opener = btn;
    markRead(q, btn);
    if (!dialog.open) dialog.showModal();
  }

  function openFrom(btn) {
    const q = quoteOf.get(btn);
    if (q) openQuote(q, btn);
  }

  function paint(list) {
    const spots = spotsFor(list);
    const frag = document.createDocumentFragment();
    const day = chicagoToday();
    let nextToday = null;
    list.forEach((q, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "star";
      const key = quoteKey(q);
      const read = readKeys.has(key);
      const today = q.date === day && !read;
      if (read) btn.classList.add("is-read");
      else if (today) btn.classList.add("is-today");
      btn.style.left = spots[i].l + "%";
      btn.style.top = spots[i].t + "%";
      btn.style.setProperty("--d", ((i % 7) * 0.13).toFixed(2) + "s");
      btn.setAttribute("aria-haspopup", "dialog");
      btn.setAttribute("aria-label", (today ? "today's quote, " : "quote for ") + spokenDate(q.date));
      btn.innerHTML = STAR;
      setGlyphFill(btn);
      quoteOf.set(btn, q);
      if (today && !nextToday) nextToday = btn;
      btn.addEventListener("focus", () => {
        if (!keyboardNav || suppressStarFocus) return;
        centerOnImage((spots[i].l / 100) * imgW, (spots[i].t / 100) * imgH);
      });
      frag.appendChild(btn);
    });
    sky.replaceChildren(frag);
    todayBtn = nextToday;
    if (!todayBtn) guide.hidden = true;
    else updateGuide();
  }

  function applyList(rows) {
    const list = usable(rows);
    const sig = list.map((q) => q.date + "\0" + q.text + "\0" + q.author).join("\n");
    if (sig === signature) return;
    signature = sig;
    current = list;
    paint(list);
  }

  function load() {
    fetch(QUOTES, { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((rows) => {
        if (Array.isArray(rows)) applyList(rows);
      })
      .catch(() => {});
  }

  function msUntilChicagoMidnight() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23",
    }).formatToParts(new Date());
    const get = (type) => Number(parts.find((p) => p.type === type).value);
    let hour = get("hour");
    if (hour === 24) hour = 0;
    const elapsed = ((hour * 60 + get("minute")) * 60 + get("second")) * 1000;
    return (24 * 60 * 60 * 1000) - elapsed + 1500;
  }

  function scheduleMidnight() {
    clearTimeout(midnightTimer);
    midnightTimer = setTimeout(() => {
      load();
      scheduleMidnight();
    }, Math.max(5000, msUntilChicagoMidnight()));
  }

  dialog.addEventListener("click", (e) => {
    if (performance.now() < blockDismissUntil) return;
    if (!inner.contains(e.target)) {
      suppressStarFocus = true;
      dialog.close();
      releaseStarFocus();
    }
  });
  dialog.addEventListener("close", () => {
    releaseStarFocus();
  });
  dialog.addEventListener("cancel", (e) => {
    e.preventDefault();
    suppressStarFocus = true;
    dialog.close();
    releaseStarFocus();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") load();
  });
  window.addEventListener("pageshow", load);
  window.addEventListener("resize", onResize);
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", onResize);
    visualViewport.addEventListener("scroll", onResize);
  }
  mural.addEventListener("load", () => {
    const w = mural.naturalWidth;
    const h = mural.naturalHeight;
    if (!w || !h || (w === imgW && h === imgH)) return;
    readImageSize();
    if (pinnedToFace) frameFace();
    else onResize();
    if (current.length) paint(current);
  });

  loadRead();
  readImageSize();
  onResize();
  load();
  scheduleMidnight();
})();
</script>
</body>
</html>
