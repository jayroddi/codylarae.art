<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102028">
<meta name="color-scheme" content="dark">
<meta name="description" content="a venice beach mural.">
<title>cody larae</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="canonical" href="https://codylarae.art/">
<meta property="og:type" content="website">
<meta property="og:title" content="cody larae">
<meta property="og:description" content="a venice beach mural.">
<meta property="og:url" content="https://codylarae.art/">
<meta property="og:image" content="https://codylarae.art/mural.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="cody larae">
<meta name="twitter:description" content="a venice beach mural.">
<meta name="twitter:image" content="https://codylarae.art/mural.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6efe9;
    --ink-2: rgba(246, 239, 233, 0.72);
    --ink-3: rgba(246, 239, 233, 0.5);
    --star: #ff4d1a;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #102028;
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .cover {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 46% 46%;
    user-select: none;
    -webkit-user-drag: none;
  }
  .sky {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 48px;
    height: 48px;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .star svg {
    display: block;
    overflow: visible;
    animation: pulse 3.2s ease-in-out infinite;
    animation-delay: var(--d, 0s);
    filter:
      drop-shadow(0 0 4px rgba(255, 77, 26, 0.8))
      drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.72; transform: scale(0.86); }
    50% { opacity: 1; transform: scale(1); }
  }
  .star:hover svg,
  .star:focus-visible svg {
    opacity: 1;
    transform: scale(1.2);
    animation: none;
  }
  .star:focus { outline: none; }
  .star:focus-visible {
    outline: 2px solid var(--star);
    outline-offset: 1px;
  }
  .ig {
    position: fixed;
    z-index: 3;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(10px, env(safe-area-inset-bottom));
    padding: 8px 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    color: rgba(255, 255, 255, 0.92);
    text-decoration: none;
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.9),
      0 0 8px rgba(0, 0, 0, 0.65);
  }
  .ig:hover { color: #fff; }
  .ig:focus-visible {
    outline: 2px solid var(--star);
    outline-offset: 3px;
  }
  dialog {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    overflow: hidden;
  }
  dialog::backdrop {
    background: rgba(6, 10, 14, 0.78);
  }
  .sheet {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding:
      max(28px, env(safe-area-inset-top))
      22px
      max(28px, env(safe-area-inset-bottom));
  }
  .inner {
    width: fit-content;
    max-width: min(34rem, 100%);
    max-height: 100%;
    overflow: auto;
    text-align: left;
  }
  .inner time {
    display: block;
    margin: 0 0 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-3);
  }
  .inner blockquote {
    margin: 0;
    quotes: none;
    font-family: var(--mono);
    font-size: clamp(16px, 2.3vw, 22px);
    font-weight: 500;
    line-height: 1.65;
    color: rgba(246, 239, 233, 0.92);
    text-align: left;
    text-transform: lowercase;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .inner blockquote::before,
  .inner blockquote::after { content: none; }
  .by {
    margin: 12px 0 0;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--star);
    text-align: right;
    text-transform: lowercase;
  }
  ::selection { background: var(--star); color: #1a0c06; }
  @media (prefers-reduced-motion: reduce) {
    .star svg { animation: none; opacity: 0.95; transform: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] .inner { animation: rise 180ms ease; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<h1 class="sr">cody larae</h1>
<img class="cover" src="mural.jpg" width="2800" height="1867" alt="Venice Beach mural of a laughing boy in thick black glasses, painted on a dark utility box, with the word Never beside him." fetchpriority="high">
<div id="sky" class="sky"></div>
<a class="ig" href="https://instagram.com/cody_larae_irl" target="_blank" rel="noopener noreferrer">@cody_larae_irl</a>
<dialog id="quote" aria-labelledby="q-text">
  <div class="sheet">
    <article class="inner">
      <time id="q-date"></time>
      <blockquote id="q-text"></blockquote>
      <p class="by" id="q-by"></p>
    </article>
  </div>
</dialog>
<script>
(() => {
  const QUOTES = "https://jayroddi.dev/quote-of-the-day/quotes.json";
  const MAX = 48;
  const sky = document.getElementById("sky");
  const dialog = document.getElementById("quote");
  const qDate = document.getElementById("q-date");
  const qText = document.getElementById("q-text");
  const qBy = document.getElementById("q-by");
  const inner = dialog.querySelector(".inner");
  let opener = null;

  const STAR = '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="#FF4D1A" d="M12 1.15 14.1 9.9 22.85 12 14.1 14.1 12 22.85 9.9 14.1 1.15 12 9.9 9.9Z"/></svg>';

  function chicagoToday() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date());
    const get = (type) => parts.find((p) => p.type === type).value;
    return `${get("year")}-${get("month")}-${get("day")}`;
  }

  function spokenDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Intl.DateTimeFormat("en-US", {
      month: "long",
      day: "numeric",
      year: "numeric",
      timeZone: "UTC",
    }).format(new Date(Date.UTC(y, m - 1, d)));
  }

  function usable(rows) {
    const day = chicagoToday();
    return rows
      .filter((e) => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.date <= day)
      .map((e) => ({
        date: e.date,
        text: String(e.text || e.quote || "").trim(),
        author: String(e.author || "").trim().replace(/^\s*[-–—]\s*/, ""),
      }))
      .filter((e) => e.text && e.author)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
      .slice(0, MAX);
  }

  function scatter(n) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const margin = 32;
    const reserveW = 176;
    const reserveH = 48;
    const pts = [];
    let min = Math.max(56, Math.min(88, Math.hypot(w, h) / Math.sqrt(n + 4)));
    for (let round = 0; round < 7 && pts.length < n; round++) {
      let tries = 0;
      while (pts.length < n && tries < 5000) {
        tries++;
        const x = margin + Math.random() * Math.max(1, w - margin * 2);
        const y = margin + Math.random() * Math.max(1, h - margin * 2);
        if (x < reserveW && y > h - reserveH) continue;
        let ok = true;
        for (const p of pts) {
          const dx = p.x - x;
          const dy = p.y - y;
          if (dx * dx + dy * dy < min * min) { ok = false; break; }
        }
        if (ok) pts.push({ x, y });
      }
      min *= 0.72;
    }
    while (pts.length < n) {
      pts.push({
        x: margin + Math.random() * Math.max(1, w - margin * 2),
        y: margin + Math.random() * Math.max(1, h - margin * 2),
      });
    }
    return pts.map((p) => ({ l: (p.x / w) * 100, t: (p.y / h) * 100 }));
  }

  function openQuote(q, btn) {
    qDate.dateTime = q.date;
    qDate.textContent = q.date.replaceAll("-", ".");
    qText.textContent = q.text;
    qBy.textContent = q.author;
    opener = btn;
    if (!dialog.open) dialog.showModal();
  }

  function paint(list) {
    const spots = scatter(list.length);
    const frag = document.createDocumentFragment();
    list.forEach((q, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "star";
      btn.style.left = spots[i].l + "%";
      btn.style.top = spots[i].t + "%";
      btn.style.setProperty("--d", (Math.random() * 3.2).toFixed(2) + "s");
      btn.setAttribute("aria-haspopup", "dialog");
      btn.setAttribute("aria-label", "quote for " + spokenDate(q.date));
      btn.innerHTML = STAR;
      btn.addEventListener("click", () => openQuote(q, btn));
      frag.appendChild(btn);
    });
    sky.replaceChildren(frag);
  }

  dialog.addEventListener("click", (e) => {
    if (!inner.contains(e.target)) dialog.close();
  });
  dialog.addEventListener("close", () => {
    if (opener) opener.focus();
  });

  fetch(QUOTES, { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((rows) => {
      if (!Array.isArray(rows)) return;
      const list = usable(rows);
      if (list.length) paint(list);
    })
    .catch(() => {});
})();
</script>
</body>
</html>
