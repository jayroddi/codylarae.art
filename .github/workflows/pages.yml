name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html mural.jpg favicon.ico favicon-32.png apple-touch-icon.png CNAME .nojekyll _site/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Set custom domain
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const domain = await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                cname: "codylarae.art",
              });
              core.info("cname=" + domain.data.cname + " https_enforced=" + domain.data.https_enforced);
            } catch (error) {
              core.warning("Could not set custom domain: " + (error.response?.data?.message || error.message));
            }
            try {
              const https = await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                https_enforced: true,
              });
              core.info("https_enforced=" + https.data.https_enforced);
            } catch (error) {
              core.warning("HTTPS not enforceable yet: " + (error.response?.data?.message || error.message));
            }
